interface:
  display_name: "Yespo Analytics"
  short_description: "Inspect native Yespo reports and summarize verified metrics and coverage."
  default_prompt: >-
    Use the yespo-analytics skill on the selected Yespo/eSputnik OAuth MCP
    connection. Route contact summary/status/growth, forms, Web Widget campaigns,
    true InApp, App Inbox, WEB/MOBILE recommendations, account orders, messaging
    and events to their own advertised read tools. Download signed CSV/JSON
    directly; inspect rows and metadata and verify completeness before totals.
    Preserve native metric names, missing values, currency, status, dates and
    attribution definitions. Native revenue share and store report ratios do
    not establish reconciled same-order-period store contributions. Do not
    invent verified seen/unseen conversion from incomplete history. Stay
    read-only and account-scoped; summarize unless exports are requested.
